<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎬 CineQuick - Movie Summary Generator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b0f19;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 30px 15px;
      display: flex;
      justify-content: center;
    }
    .container { width: 100%; max-width: 850px; }
    
    .header { text-align: center; margin-bottom: 25px; }
    .header h1 { color: #f59e0b; font-size: 30px; margin-bottom: 8px; }
    .header p { color: #94a3b8; font-size: 15px; }

    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
      background: #1e293b;
      padding: 8px;
      border-radius: 12px;
      border: 1px solid #334155;
    }
    input {
      flex: 1;
      padding: 12px 15px;
      border: none;
      background: transparent;
      color: #fff;
      font-size: 16px;
      outline: none;
    }
    button {
      padding: 12px 24px;
      border-radius: 8px;
      border: none;
      background: #f59e0b;
      color: #0f172a;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }
    button:hover { background: #d97706; }

    .status { text-align: center; color: #94a3b8; font-size: 16px; margin: 20px 0; }

    .movie-card {
      background: #1e293b;
      border-radius: 16px;
      padding: 25px;
      display: flex;
      flex-direction: column;
      gap: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 1px solid #334155;
    }
    @media (min-width: 650px) {
      .movie-card { flex-direction: row; }
    }
    
    .poster-container { text-align: center; }
    .poster { width: 220px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
    
    .details { flex: 1; }
    .title { font-size: 26px; font-weight: bold; color: #38bdf8; margin-bottom: 6px; }
    .tagline { font-style: italic; color: #f59e0b; font-size: 14px; margin-bottom: 12px; }
    .meta { font-size: 14px; color: #94a3b8; margin-bottom: 20px; }

    .summary-box {
      background: #0f172a;
      padding: 18px;
      border-radius: 10px;
      margin-bottom: 15px;
      border-left: 4px solid #f59e0b;
    }
    .summary-box h3 { font-size: 15px; color: #f59e0b; margin-bottom: 8px; }
    .summary-text { font-size: 15px; line-height: 1.6; color: #e2e8f0; }

    .btn-group { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 15px; }
    .btn {
      padding: 10px 18px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-yt { background: #dc2626; }
    .btn-google { background: #2563eb; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>🎬 CineQuick Summary</h1>
      <p>ඕනෑම ෆිල්ම් එකක කතාව සිංහලෙන් සහ ඉංග්‍රීසියෙන් ක්ෂණිකව දැනගන්න</p>
    </div>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="ෆිල්ම් එකේ නම ටයිප් කරන්න... (උදා: Avatar, Spiderman)">
      <button onclick="getMovieSummary()">Search</button>
    </div>

    <div id="status"></div>
    <div id="result"></div>
  </div>

  <script>
    const API_KEY = 'c2b3f114c0228dcd93f9cbe8b2e11893'; // Updated Working Key

    async function getMovieSummary() {
      const query = document.getElementById('searchInput').value.trim();
      const status = document.getElementById('status');
      const result = document.getElementById('result');

      if (!query) return;

      status.innerText = 'ෆිල්ම් එක සොයමින් පවතී...';
      result.innerHTML = '';

      try {
        // 1. TMDB API එක Proxy හරහා Call කිරීම (ලංකාවේ Block වීම නැවැත්වීමට)
        const targetSearchUrl = `https://api.themoviedb.org/3/search/movie?api_key=${API_KEY}&query=${encodeURIComponent(query)}`;
        const proxySearchUrl = 'https://corsproxy.io/?' + encodeURIComponent(targetSearchUrl);

        const searchRes = await fetch(proxySearchUrl);
        const searchData = await searchRes.json();

        if (!searchData.results || searchData.results.length === 0) {
          status.innerText = 'එබඳු ෆිල්ම් එකක් සොයාගැනීමට නොහැකි විය. වෙනත් නමක් ටයිප් කර බලන්න.';
          return;
        }

        const movie = searchData.results[0];

        // 2. Movie Details Proxy හරහා ගැනීම
        const targetDetailUrl = `https://api.themoviedb.org/3/movie/${movie.id}?api_key=${API_KEY}`;
        const proxyDetailUrl = 'https://corsproxy.io/?' + encodeURIComponent(targetDetailUrl);
        const detailRes = await fetch(proxyDetailUrl);
        const movieDetail = await detailRes.json();

        const overviewEn = movie.overview || 'Description not available.';

        // 3. සිංහලට පරිවර්තනය කිරීම
        status.innerText = 'කතාව සිංහලට පරිවර්තනය කරමින් පවතී...';
        let overviewSi = 'සිංහල පරිවර්තනය සූදානම් වෙමින් පවතී...';

        try {
          const transUrl = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(overviewEn.substring(0, 450))}&langpair=en|si`;
          const transRes = await fetch('https://corsproxy.io/?' + encodeURIComponent(transUrl));
          const transData = await transRes.json();
          if (transData.responseData && transData.responseData.translatedText) {
            overviewSi = transData.responseData.translatedText;
          }
        } catch (e) {
          console.error("Translation Error:", e);
        }

        status.innerText = '';

        const posterPath = movie.poster_path 
          ? `https://image.tmdb.org/t/p/w500${movie.poster_path}` 
          : 'https://via.placeholder.com/500x750?text=No+Poster';

        // 4. UI එක සාදා පෙන්වීම
        result.innerHTML = `
          <div class="movie-card">
            <div class="poster-container">
              <img class="poster" src="${posterPath}" alt="${movie.title}">
            </div>
            <div class="details">
              <div class="title">${movie.title}</div>
              ${movieDetail.tagline ? `<div class="tagline">"${movieDetail.tagline}"</div>` : ''}
              
              <div class="meta">
                <span>📅 ${movie.release_date || 'N/A'}</span> | 
                <span>⭐ ${movie.vote_average ? movie.vote_average.toFixed(1) : 'N/A'} / 10</span> | 
                <span>⏱️ ${movieDetail.runtime || 'N/A'} min</span>
              </div>

              <div class="summary-box">
                <h3>🇱🇰 කතාව කෙටියෙන් (සිංහලෙන්)</h3>
                <div class="summary-text">${overviewSi}</div>
              </div>

              <div class="summary-box" style="border-left-color: #38bdf8;">
                <h3>🇬🇧 Storyline (English)</h3>
                <div class="summary-text">${overviewEn}</div>
              </div>

              <div class="btn-group">
                <a class="btn btn-yt" href="https://www.youtube.com/results?search_query=${encodeURIComponent(movie.title + ' official trailer')}" target="_blank">▶ Official Trailer</a>
                <a class="btn btn-google" href="https://www.google.com/search?q=${encodeURIComponent(movie.title + ' movie review')}" target="_blank">🔍 Reviews & Details</a>
              </div>
            </div>
          </div>
        `;

      } catch (error) {
        console.error(error);
        status.innerText = 'දත්ත ලබාගැනීමේදී දෝෂයක් සිදු විය. කරුණාකර නැවත උත්සාහ කරන්න.';
      }
    }
  </script>

</body>
</html>
