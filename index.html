<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>∞ Infinity Grid Bot — Live Server</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#090c14; color:#eef1f8; font-family:'Segoe UI',system-ui,sans-serif; padding:24px; }
  h1 { font-size:20px; margin-bottom:4px; }
  .sub { color:#8b95b0; font-size:13px; margin-bottom:24px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; margin-bottom:24px; }
  .card { background:#131a2b; border:1px solid #232c44; border-radius:12px; padding:16px; }
  .card .label { font-size:11px; color:#8b95b0; margin-bottom:6px; }
  .card .value { font-size:20px; font-weight:700; font-family:monospace; }
  .green { color:#2ebd85; } .red { color:#f6465d; }
  .panel { background:#131a2b; border:1px solid #232c44; border-radius:12px; padding:18px; margin-bottom:20px; }
  input, button { font-family:inherit; font-size:14px; }
  input { background:#0d1220; border:1px solid #232c44; color:#eef1f8; padding:10px; border-radius:8px; width:100%; margin-bottom:10px; }
  label { font-size:12px; color:#8b95b0; display:block; margin-bottom:4px; }
  button { background:#4f7cff; border:none; color:#fff; padding:10px 16px; border-radius:8px; cursor:pointer; font-weight:600; }
  button.danger { background:#f6465d; }
  .status-pill { display:inline-block; padding:4px 10px; border-radius:20px; font-size:12px; font-weight:600; }
  .status-pill.RUNNING { background:rgba(46,189,133,0.15); color:#2ebd85; }
  .status-pill.STOPPED { background:rgba(246,70,93,0.15); color:#f6465d; }
  table { width:100%; border-collapse:collapse; font-family:monospace; font-size:12px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid #1c2338; }
  th { color:#8b95b0; font-weight:500; }
  .form-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  #err { color:#f6465d; font-size:13px; margin-bottom:10px; }
</style>
</head>
<body>
  <h1>∞ Infinity Grid Bot</h1>
  <div class="sub" id="server-note">Connecting to server…</div>

  <div id="app"></div>

<script>
async function api(path, opts) {
  const res = await fetch(path, opts);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}

function fmt(n, d) {
  d = d === undefined ? 2 : d;
  const v = Number(n);
  if (!isFinite(v)) return '0.00';
  return v.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
}

function renderCreateForm() {
  return \`
    <div class="panel">
      <h3 style="margin-bottom:14px">Create Bot (paper trading)</h3>
      <div id="err"></div>
      <label>Trading Pair (e.g. BTC-USDT)</label>
      <input id="f-pair" value="BTC-USDT" />
      <div class="form-row">
        <div>
          <label>Investment (USDT)</label>
          <input id="f-inv" type="number" value="1000" />
        </div>
        <div>
          <label>Lowest Price (stop below this)</label>
          <input id="f-low" type="number" value="" />
        </div>
      </div>
      <label>Grid Step (%)</label>
      <input id="f-grid" type="number" value="1.5" step="0.1" />
      <button onclick="createBot()">Create Bot</button>
    </div>
  \`;
}

async function createBot() {
  const errEl = document.getElementById('err');
  errEl.textContent = '';
  try {
    await api('/api/bot', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        pair: document.getElementById('f-pair').value,
        investment: document.getElementById('f-inv').value,
        lowestPrice: document.getElementById('f-low').value,
        gridPct: document.getElementById('f-grid').value
      })
    });
    refresh();
  } catch (e) {
    errEl.textContent = e.message;
  }
}

async function deleteBot() {
  if (!confirm('Delete this bot? This cannot be undone.')) return;
  await api('/api/bot', { method: 'DELETE' });
  refresh();
}

function renderDashboard(bot) {
  const price = bot.lastPrice;
  const tv = bot.totalValue, tp = bot.totalProfit, upnl = bot.unrealizedPnl;
  const pctReturn = (tp / bot.investment) * 100;
  const rows = bot.history.slice(-15).reverse().map(h => \`
    <tr>
      <td>\${h.time.slice(0,19).replace('T',' ')}</td>
      <td>\${h.action}</td>
      <td>\${h.price ? '$'+fmt(h.price,4) : '—'}</td>
      <td>\${h.amount ? fmt(h.amount,6) : '—'}</td>
      <td class="\${h.gridProfit>=0?'green':'red'}">\${fmt(h.gridProfit,4)}</td>
    </tr>\`).join('');

  return \`
    <div class="panel">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <div>
          <span style="font-size:18px;font-weight:700">\${bot.pair}</span>
          <span class="status-pill \${bot.status.startsWith('STOPPED')?'STOPPED':'RUNNING'}">\${bot.status}</span>
        </div>
        <button class="danger" onclick="deleteBot()">Delete Bot</button>
      </div>
      <div class="grid">
        <div class="card"><div class="label">Current Price</div><div class="value">$\${fmt(price,4)}</div></div>
        <div class="card"><div class="label">Total Value</div><div class="value">$\${fmt(tv)}</div></div>
        <div class="card"><div class="label">Total Profit</div><div class="value \${tp>=0?'green':'red'}">\${tp>=0?'+':''}\${fmt(tp)} (\${fmt(pctReturn)}%)</div></div>
        <div class="card"><div class="label">Grid Profit (realized)</div><div class="value green">+\${fmt(bot.gridProfit,4)}</div></div>
        <div class="card"><div class="label">Unrealized P&L</div><div class="value \${upnl>=0?'green':'red'}">\${fmt(upnl,4)}</div></div>
        <div class="card"><div class="label">Trades</div><div class="value">\${bot.tradeCount}</div></div>
      </div>
      <div class="grid">
        <div class="card"><div class="label">Next SELL</div><div class="value green">\${bot.nextTriggers.sellPrice ? '$'+fmt(bot.nextTriggers.sellPrice,4) : '—'}</div></div>
        <div class="card"><div class="label">Next BUY</div><div class="value red">\${bot.nextTriggers.hasUsdt ? (bot.nextTriggers.buyPrice ? '$'+fmt(bot.nextTriggers.buyPrice,4) : '—') : 'No USDT left'}</div></div>
      </div>
    </div>
    <div class="panel">
      <h3 style="margin-bottom:12px">Recent Trades</h3>
      <table>
        <thead><tr><th>Time</th><th>Action</th><th>Price</th><th>Amount</th><th>Grid Profit</th></tr></thead>
        <tbody>\${rows || '<tr><td colspan="5">No trades yet</td></tr>'}</tbody>
      </table>
    </div>
  \`;
}

async function refresh() {
  try {
    const { bot } = await api('/api/bot');
    document.getElementById('server-note').textContent =
      'Server-side bot — keeps trading even if you close this page, as long as the server process is running.';
    document.getElementById('app').innerHTML = bot ? renderDashboard(bot) : renderCreateForm();
  } catch (e) {
    document.getElementById('server-note').textContent = 'Could not reach server: ' + e.message;
  }
}

refresh();
setInterval(refresh, 1000);
</script>
</body>
</html>
