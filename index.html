<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎬 CineQuick AI - Instant Movie Summaries</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b0f19;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 40px 15px;
      display: flex;
      justify-content: center;
    }
    .container { width: 100%; max-width: 750px; }
    
    .header { text-align: center; margin-bottom: 30px; }
    .header h1 { color: #f59e0b; font-size: 32px; margin-bottom: 10px; }
    .header p { color: #94a3b8; font-size: 15px; }

    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
      background: #1e293b;
      padding: 8px;
      border-radius: 12px;
      border: 1px solid #334155;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    input[type="text"] {
      flex: 1;
      padding: 14px 18px;
      border: none;
      background: transparent;
      color: #fff;
      font-size: 16px;
      outline: none;
    }
    button {
      padding: 14px 28px;
      border-radius: 8px;
      border: none;
      background: #f59e0b;
      color: #0f172a;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }
    button:hover { background: #d97706; }

    #status { text-align: center; color: #38bdf8; font-size: 16px; margin: 20px 0; font-weight: 500; }

    .result-card {
      background: #1e293b;
      border-radius: 16px;
      padding: 25px;
      border: 1px solid #334155;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .movie-title { font-size: 28px; color: #38bdf8; font-weight: bold; }
    .movie-meta { font-size: 14px; color: #94a3b8; margin: 5px 0 15px 0; }
    .tagline { font-style: italic; color: #f59e0b; font-size: 15px; margin-bottom: 20px; }

    .section-title { font-size: 16px; color: #f59e0b; margin-bottom: 8px; font-weight: bold; }
    .summary-text { font-size: 15px; line-height: 1.7; color: #e2e8f0; margin-bottom: 20px; background: #0f172a; padding: 15px; border-radius: 8px; }

    .why-list { list-style-type: none; margin-bottom: 20px; background: #0f172a; padding: 15px; border-radius: 8px; }
    .why-list li { margin-bottom: 8px; font-size: 14px; color: #cbd5e1; }
    .why-list li::before { content: "🔥 "; }

    .btn-group { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
    .btn {
      padding: 10px 18px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
    }
    .btn-yt { background: #dc2626; }
    .btn-google { background: #2563eb; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>🎬 CineQuick AI</h1>
      <p>ඕනෑම ෆිල්ම් එකක නම ටයිප් කර කතාව ක්ෂණිකව සිංහලෙන් දැනගන්න</p>
    </div>

    <!-- යූසර්ට පෙනෙන්නේ මේ Search Box එක විතරයි -->
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="ෆිල්ම් එකේ නම ටයිප් කරන්න... (උදා: Avatar, Inception, Maharaja)">
      <button onclick="generateMovieSummary()">Search</button>
    </div>

    <div id="status"></div>
    <div id="result"></div>
  </div>

  <script>
    // 🔑 ඔයාගේ Google Gemini API Key එක මෙතනට දාන්න:
    const GEMINI_API_KEY = 'AQ.Ab8RN6Ljze5quCcWM2LfnNpAC4YFi3gDfy9jLr-ECgFzUTDdjw';

    async function generateMovieSummary() {
      const query = document.getElementById('searchInput').value.trim();
      const status = document.getElementById('status');
      const result = document.getElementById('result');

      if (!query) return;

      if (GEMINI_API_KEY === 'YOUR_GEMINI_API_KEY_HERE' || !GEMINI_API_KEY) {
        alert('කරුණාකර Script එකේ GEMINI_API_KEY එක ඇතුළත් කරන්න!');
        return;
      }

      status.innerText = '🤖 AI එක මඟින් ෆිල්ම් එක විශ්ලේෂණය කර කතාව සිංහලෙන් සකසමින් පවතී...';
      result.innerHTML = '';

      const prompt = `You are a movie expert. For the movie "${query}", return ONLY a JSON object with this exact schema:
      {
        "title": "Official Title",
        "year": "Release Year",
        "genre": "Genre",
        "tagline": "A super catchy 1-line Sinhala teaser to make people excited",
        "sinhala_story": "An exciting, suspenseful 3-4 sentence movie plot summary in highly natural, appealing Sinhala without spoilers that makes people eager to watch it.",
        "why_watch": ["Point 1 in Sinhala", "Point 2 in Sinhala", "Point 3 in Sinhala"],
        "english_story": "A brief 2-sentence summary in English"
      }`;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }],
            generationConfig: { responseMimeType: "application/json" }
          })
        });

        const data = await response.json();

        if (data.candidates && data.candidates[0].content.parts[0].text) {
          const movie = JSON.parse(data.candidates[0].content.parts[0].text);
          status.innerText = '';

          result.innerHTML = `
            <div class="result-card">
              <div class="movie-title">${movie.title}</div>
              <div class="movie-meta">📅 ${movie.year} | 🎭 ${movie.genre}</div>
              <div class="tagline">"${movie.tagline}"</div>

              <div class="section-title">🇱🇰 කතාව කෙටියෙන් (සිංහලෙන්):</div>
              <div class="summary-text">${movie.sinhala_story}</div>

              <div class="section-title">✨ මේ ෆිල්ම් එක බලන්නම ඕනේ ඇයි?</div>
              <ul class="why-list">
                ${movie.why_watch.map(point => `<li>${point}</li>`).join('')}
              </ul>

              <div class="section-title">🇬🇧 Storyline (English):</div>
              <div class="summary-text" style="color: #94a3b8;">${movie.english_story}</div>

              <div class="btn-group">
                <a class="btn btn-yt" href="https://www.youtube.com/results?search_query=${encodeURIComponent(movie.title + ' official trailer')}" target="_blank">▶ Watch Trailer</a>
                <a class="btn btn-google" href="https://www.google.com/search?q=${encodeURIComponent(movie.title + ' full movie')}" target="_blank">🔍 Google Search</a>
              </div>
            </div>
          `;
        } else {
          status.innerText = 'විස්තර ලබාගැනීමට නොහැකි විය. කරුණාකර ෆිල්ම් එකේ නම නිවැරදිදැයි පරීක්ෂා කරන්න.';
        }
      } catch (error) {
        console.error(error);
        status.innerText = 'දෝෂයක් සිදු විය. කරුණාකර නැවත උත්සාහ කරන්න.';
      }
    }

    // Enter Key එක එබූ විට Search වෙන්න හදන්න:
    document.getElementById("searchInput").addEventListener("keypress", function(event) {
      if (event.key === "Enter") {
        generateMovieSummary();
      }
    });
  </script>

</body>
</html>
