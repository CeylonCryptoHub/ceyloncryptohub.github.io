<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🇱🇰 Live Crypto Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      padding: 30px 15px;
    }
    .container { width: 100%; max-width: 800px; }
    h1 { text-align: center; color: #38bdf8; margin-bottom: 20px; font-size: 26px; }
    
    #searchInput {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #fff;
      font-size: 16px;
      margin-bottom: 20px;
      outline: none;
    }
    #searchInput:focus { border-color: #38bdf8; }

    .status-msg { text-align: center; color: #94a3b8; font-size: 16px; padding: 20px; }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #1e293b;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    th, td { padding: 14px 16px; text-align: left; border-bottom: 1px solid #334155; }
    th { background-color: #0f172a; color: #94a3b8; font-size: 14px; text-transform: uppercase; }
    
    .coin-cell { display: flex; align-items: center; gap: 10px; font-weight: 600; }
    .coin-cell img { width: 26px; height: 26px; }
    .green { color: #4ade80; font-weight: bold; }
    .red { color: #f87171; font-weight: bold; }
  </style>
</head>
<body>

  <div class="container">
    <h1>🚀 Live Crypto Tracker</h1>
    <input type="text" id="searchInput" placeholder="Crypto නම සෙවුම් කරන්න... (උදා: Bitcoin, Solana)">
    
    <div id="status" class="status-msg">දත්ත ලබාගනිමින් පවතී...</div>

    <table id="cryptoTable" style="display: none;">
      <thead>
        <tr>
          <th>Coin</th>
          <th>මිල (USD)</th>
          <th>පැය 24 වෙනස්වීම</th>
          <th>Market Cap</th>
        </tr>
      </thead>
      <tbody id="cryptoBody"></tbody>
    </table>
  </div>

  <script>
    const cryptoBody = document.getElementById('cryptoBody');
    const status = document.getElementById('status');
    const cryptoTable = document.getElementById('cryptoTable');
    const searchInput = document.getElementById('searchInput');

    let allCoins = [];

    // CoinGecko API URL එක CORS Proxy එකක් හරහා Call කිරීම (ලංකාවේ Block වීම වැළැක්වීමට)
    const targetUrl = 'https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=20&page=1&sparkline=false';
    const proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(targetUrl);

    async function loadCryptoData() {
      try {
        const response = await fetch(proxyUrl);
        if (!response.ok) throw new Error('Network response was not ok');
        
        allCoins = await response.json();
        
        displayData(allCoins);
        status.style.display = 'none';
        cryptoTable.style.display = 'table';
      } catch (error) {
        console.error(error);
        status.innerText = 'දත්ත ලබාගැනීමට නොහැකි විය. කරුණාකර Page එක Refresh කරන්න.';
      }
    }

    function displayData(coins) {
      cryptoBody.innerHTML = '';
      coins.forEach(coin => {
        const isPositive = coin.price_change_percentage_24h >= 0;
        const changeClass = isPositive ? 'green' : 'red';
        const changeSign = isPositive ? '+' : '';

        const row = document.createElement('tr');
        row.innerHTML = `
          <td class="coin-cell">
            <img src="${coin.image}" alt="${coin.name}">
            <span>${coin.name} <small style="color:#64748b">(${coin.symbol.toUpperCase()})</small></span>
          </td>
          <td>$${coin.current_price.toLocaleString()}</td>
          <td class="${changeClass}">${changeSign}${coin.price_change_percentage_24h.toFixed(2)}%</td>
          <td>$${coin.market_cap.toLocaleString()}</td>
        `;
        cryptoBody.appendChild(row);
      });
    }

    // Live Search Feature
    searchInput.addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase();
      const filtered = allCoins.filter(c => 
        c.name.toLowerCase().includes(term) || 
        c.symbol.toLowerCase().includes(term)
      );
      displayData(filtered);
    });

    // Page එක Load වෙද්දී Execute වීම
    loadCryptoData();
  </script>

</body>
</html>
